services:
  - type: web
    name: ironzone-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DB_PATH
        value: ./db/gym.db
      - key: CLIENT_URL
        sync: false
